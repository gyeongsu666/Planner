{% extends "base.html" %}
{% block title %}전체 일정{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">전체 일정</h1>
  <div class="sort-controls">
    <span>정렬:</span>
    <button class="btn btn-sm active" onclick="loadAll('date',this)">날짜순</button>
    <button class="btn btn-sm"        onclick="loadAll('importance',this)">중요도순</button>
    <button class="btn btn-sm"        onclick="loadAll('combined',this)">복합</button>
  </div>
  <button class="btn btn-primary" onclick="openAddModal()">+ 일정 추가</button>
</div>

<div id="schedule-list" class="schedule-grid"></div>

<!-- 모달은 index.html과 동일 구조 재사용 -->
{% include '_modal.html' %}
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/schedule.js') }}"></script>
<script>loadAll('date');</script>
{% endblock %}
