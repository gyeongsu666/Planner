<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary  : #4f6ef7;
  --bg       : #f0f2f8;
  --surface  : #ffffff;
  --border   : #e8eaf0;
  --text     : #1a1d2e;
  --text-sub : #6b7280;
  --text-xs  : #9ca3af;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
       background: var(--bg); font-size: 13px; color: var(--text); }

/* ── 헤더 ─────────────────────────── */
.header {
  background: linear-gradient(135deg, #4f6ef7, #7c93fa);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 6px;
  cursor: move; user-select: none;
  box-shadow: 0 2px 8px rgba(79,110,247,.3);
}
.header-icon  { font-size: 16px; }
.header-title { color: #fff; font-size: 13px; font-weight: 700; flex: 1; }
.header-date  { color: rgba(255,255,255,.65); font-size: 10px; white-space: nowrap; }
.hbtn {
  width: 24px; height: 24px; border: none; border-radius: 6px;
  background: rgba(255,255,255,.18); color: #fff;
  font-size: 12px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; transition: background .15s;
}
.hbtn:hover          { background: rgba(255,255,255,.35); }
.hbtn.close:hover    { background: rgba(239,68,68,.75); }

/* ── 리스트 ───────────────────────── */
.list {
  height: calc(100vh - 46px);
  overflow-y: auto; padding: 8px;
}
.list::-webkit-scrollbar       { width: 4px; }
.list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── 카드 ─────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 6px;
  display: flex; gap: 10px; align-items: stretch;
  transition: box-shadow .15s;
}
.card:hover { box-shadow: 0 4px 12px rgba(79,110,247,.12); }
.card.in-progress { background: #eff6ff; border-color: #bfdbfe; }

.imp-bar { width: 4px; border-radius: 2px; flex-shrink: 0; }
.card-body { flex: 1; min-width: 0; }
.card-top  { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.card-title {
  font-size: 12px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
}
.badge {
  padding: 1px 6px; border-radius: 999px;
  font-size: 10px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
}
.badge-진행중 { background: #dbeafe; color: #1e40af; }
.badge-마감   { background: #fff1f2; color: #be123c; }
.card-time    { font-size: 11px; color: var(--text-sub); }

/* ── 빈 상태 ──────────────────────── */
.empty {
  text-align: center; padding: 48px 20px;
  color: var(--text-xs); font-size: 13px; line-height: 1.8;
}
.empty-icon { font-size: 32px; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="header" id="hdr">
  <span class="header-icon">📅</span>
  <span class="header-title">오늘의 일정</span>
  <span class="header-date" id="lbl-date"></span>
  <button class="hbtn" onclick="load()" title="새로고침">↻</button>
  <button class="hbtn close" onclick="pywebview.api.close()" title="닫기">✕</button>
</div>
<div class="list" id="list"></div>

<script>
const IMP = {1:'#9ca3af',2:'#22c55e',3:'#eab308',4:'#f97316',5:'#ef4444'};

/* ── 드래그 ──────────────────────── */
let dragging = false;
const hdr = document.getElementById('hdr');

hdr.addEventListener('mousedown', e => {
  if (e.target.tagName === 'BUTTON') return;
  dragging = true;
  pywebview.api.drag_start(e.screenX, e.screenY);
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  pywebview.api.drag_move(e.screenX, e.screenY);
});
document.addEventListener('mouseup', () => { dragging = false; });

/* ── 데이터 로드 ─────────────────── */
async function load() {
  const today = new Date();
  document.getElementById('lbl-date').textContent =
    today.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });

  const items = await pywebview.api.get_today();
  const el = document.getElementById('list');

  if (!items.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">😊</div>
      오늘 일정이 없습니다
    </div>`;
    return;
  }

  el.innerHTML = items.map(s => {
    const color   = IMP[s.importance] || '#9ca3af';
    const inProg  = s.status === '진행중';
    const timeStr = s.is_deadline
      ? `⏰ 마감 ${s.end_time}`
      : `🕐 ${s.start_time} ~ ${s.end_time}`;
    const badge = inProg
      ? `<span class="badge badge-진행중">진행중</span>`
      : s.is_deadline ? `<span class="badge badge-마감">마감</span>` : '';
    return `
      <div class="card ${inProg ? 'in-progress' : ''}">
        <div class="imp-bar" style="background:${color}"></div>
        <div class="card-body">
          <div class="card-top">
            <div class="card-title">${s.title}</div>${badge}
          </div>
          <div class="card-time">${timeStr}</div>
        </div>
      </div>`;
  }).join('');
}

window.addEventListener('pywebviewready', () => {
  load();
  setInterval(load, 60_000);
});
</script>
</body>
</html>
